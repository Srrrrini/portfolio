<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Roboteam mapping completeness chart">
  <rect width="640" height="240" rx="16" fill="#1c1c1e"/>

  <text x="32" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Mock construction environment — map completeness</text>

  <!-- baseline -->
  <line x1="220" y1="64" x2="220" y2="196" stroke="#3a3a3d" stroke-width="1.5"/>

  <!-- Row 1: object map completeness 87.19% -->
  <text x="32" y="88" font-family="system-ui, sans-serif" font-size="13" fill="#d1d5db">Object map</text>
  <rect x="220" y="76" width="296" height="24" rx="4" fill="#4f8fe8"/>
  <text x="526" y="93" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">87.19%</text>
  <text x="220" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">3.11 cm avg. error</text>

  <!-- Row 2: background map completeness 99.19% -->
  <text x="32" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#d1d5db">Background map</text>
  <rect x="220" y="148" width="337" height="24" rx="4" fill="#4f8fe8" opacity="0.85"/>
  <text x="567" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">99.19%</text>
  <text x="220" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">2.27 cm avg. error</text>

  <line x1="220" y1="196" x2="560" y2="196" stroke="#3a3a3d" stroke-width="1"/>
  <text x="220" y="216" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">0%</text>
  <text x="540" y="216" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">100%</text>
</svg>
