<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Roboteam semantic mapping results">
  <rect width="640" height="380" rx="16" fill="#151030"/>

  <text x="32" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Semantic mapping &#8212; heterogeneous robot teams</text>
  <text x="32" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#aaa6c3">Boston Dynamics Spot &#183; Ouster OS-1-128 LiDAR + panoramic camera &#183; YOLOv7 + SAM2</text>

  <!-- stat 1 -->
  <text x="60" y="180" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#56ccf2">87.19%</text>
  <text x="60" y="206" font-family="system-ui, sans-serif" font-size="13" fill="#c3c2b7">object map completeness</text>
  <text x="60" y="224" font-family="system-ui, sans-serif" font-size="12" fill="#898781">3.11 cm avg. error</text>

  <!-- stat 2 -->
  <text x="360" y="180" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#56ccf2">99.19%</text>
  <text x="360" y="206" font-family="system-ui, sans-serif" font-size="13" fill="#c3c2b7">background map completeness</text>
  <text x="360" y="224" font-family="system-ui, sans-serif" font-size="12" fill="#898781">2.27 cm avg. error</text>

  <line x1="32" y1="260" x2="608" y2="260" stroke="#383855" stroke-width="1"/>

  <rect x="32" y="284" width="130" height="26" rx="13" fill="#1d1836" stroke="#56ccf2" stroke-width="1"/>
  <text x="97" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#56ccf2">IEEE RA-L 2025</text>
  <text x="32" y="336" font-family="system-ui, sans-serif" font-size="12" fill="#aaa6c3">Zhan, Zhou, Yang, Zhao, Liu, Ramineni, Shimada &#8212; "Semantic exploration and</text>
  <text x="32" y="354" font-family="system-ui, sans-serif" font-size="12" fill="#aaa6c3">dense mapping of complex environments using ground robot with panoramic</text>
  <text x="32" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#aaa6c3">LiDAR-camera fusion." Robotics and Automation Letters. arXiv:2505.22880</text>
</svg>
