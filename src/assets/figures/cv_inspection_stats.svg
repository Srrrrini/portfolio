<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Automated house inspection results">
  <rect width="640" height="380" rx="16" fill="#151030"/>

  <text x="32" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Automated house inspection</text>
  <text x="32" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#aaa6c3">Computer Vision for Engineers (24-678), CMU &#183; infrared + RGB fusion</text>

  <text x="60" y="200" font-family="system-ui, sans-serif" font-size="60" font-weight="800" fill="#56ccf2">92%</text>
  <text x="60" y="228" font-family="system-ui, sans-serif" font-size="14" fill="#c3c2b7">structural-defect detection accuracy</text>

  <text x="360" y="200" font-family="system-ui, sans-serif" font-size="60" font-weight="800" fill="#56ccf2">50%</text>
  <text x="360" y="228" font-family="system-ui, sans-serif" font-size="14" fill="#c3c2b7">less inspection time vs. manual</text>

  <line x1="32" y1="260" x2="608" y2="260" stroke="#383855" stroke-width="1"/>
  <text x="32" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#aaa6c3">Detects structural wear, rust, water leaks, and roof damage from infrared</text>
  <text x="32" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#aaa6c3">imaging combined with standard RGB computer vision.</text>
</svg>
